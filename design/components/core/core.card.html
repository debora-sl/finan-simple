<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); }
  .group { margin-bottom: 22px; }
  .glabel { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 12px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .ico { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, IconButton, Input, Select, Switch, Badge, SegmentedControl } = window.ControleFinanceiroDesignSystem_2e2cd7;
    const Plus = () => <svg className="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>;
    const Dots = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>;

    function Demo() {
      const [seg, setSeg] = React.useState('mes');
      const [on, setOn] = React.useState(true);
      return (
        <div>
          <div className="group">
            <div className="glabel">Botões</div>
            <div className="row">
              <Button variant="primary" iconLeft={<Plus/>}>Adicionar</Button>
              <Button variant="secondary">Filtrar</Button>
              <Button variant="ghost">Cancelar</Button>
              <Button variant="positive">Receita</Button>
              <Button variant="negative">Despesa</Button>
              <Button variant="primary" disabled>Salvar</Button>
              <IconButton label="Opções" variant="secondary"><Dots/></IconButton>
            </div>
          </div>
          <div className="group">
            <div className="glabel">Campos</div>
            <div className="row" style={{alignItems:'flex-start'}}>
              <div style={{width:180}}><Input label="Valor" prefix="R$" placeholder="0,00" /></div>
              <div style={{width:200}}><Select label="Categoria" options={['Moradia','Mercado','Transporte','Saúde']} /></div>
              <div style={{paddingTop:28}}><Switch checked={on} onChange={setOn} label="Recorrente" /></div>
            </div>
          </div>
          <div className="group" style={{marginBottom:0}}>
            <div className="glabel">Badges & seletor</div>
            <div className="row">
              <Badge tone="positive" dot>Pago</Badge>
              <Badge tone="warning" dot>Vence em 3 dias</Badge>
              <Badge tone="negative" dot>Atrasado</Badge>
              <Badge tone="action">Cartão</Badge>
              <Badge tone="neutral">Outros</Badge>
              <SegmentedControl value={seg} onChange={setSeg} options={[{value:'sem',label:'Semana'},{value:'mes',label:'Mês'},{value:'ano',label:'Ano'}]} />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
