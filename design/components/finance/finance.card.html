<!-- @dsCard group="Components" viewport="700x460" name="Finance — cards, contas, movimentações, gráfico" subtitle="SummaryCard, BillItem, TransactionRow, CategoryBar, CategoryDonut" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); }
  .glabel { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 12px; }
  .group { margin-bottom: 22px; }
  .ico { width: 20px; height: 20px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { SummaryCard, BillItem, TransactionRow, CategoryBar, CategoryDonut, Card } = window.ControleFinanceiroDesignSystem_2e2cd7;
    const Wallet = () => <svg className="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7"/><path d="M16 12h.01"/></svg>;
    const Down = () => <svg className="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></svg>;

    function Demo() {
      return (
        <div>
          <div className="group">
            <div className="glabel">Cards de resumo</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
              <SummaryCard label="Saldo atual" value="R$ 4.280,00" tone="action" icon={<Wallet/>} delta="8%" deltaDirection="up" />
              <SummaryCard label="Despesas do mês" value="R$ 3.120,00" tone="negative" icon={<Down/>} delta="5%" deltaDirection="down" />
            </div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,alignItems:'start'}}>
            <div className="group">
              <div className="glabel">Contas a pagar</div>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                <BillItem category="moradia" name="Aluguel" status="duesoon" dueLabel="Vence em 3 dias" amount="R$ 1.800,00" onPay={()=>{}} />
                <BillItem category="cartao" name="Fatura Nubank" status="overdue" dueLabel="Venceu 10 jun" amount="R$ 940,00" onPay={()=>{}} />
              </div>
            </div>
            <div className="group">
              <div className="glabel">Movimentações</div>
              <Card padding="sm">
                <TransactionRow category="outros" description="Salário" meta="05 jun" amount="R$ 6.500,00" type="income" />
                <TransactionRow category="mercado" description="Mercado da semana" meta="12 jun · Cartão" amount="R$ 240,00" type="expense" />
                <TransactionRow category="transporte" description="Combustível" meta="13 jun" amount="R$ 180,00" type="expense" divider={false} />
              </Card>
            </div>
          </div>
          <div className="group" style={{marginBottom:0}}>
            <div className="glabel">Despesas por categoria</div>
            <Card>
              <div style={{display:'flex',gap:28,alignItems:'center'}}>
                <CategoryDonut total="R$ 3.120" totalLabel="Despesas" size={150} data={[{category:'moradia',value:1800},{category:'mercado',value:720},{category:'transporte',value:600}]} />
                <div style={{flex:1,display:'flex',flexDirection:'column',gap:16}}>
                  <CategoryBar category="moradia" label="Moradia" amount="R$ 1.800,00" percent={58} />
                  <CategoryBar category="mercado" label="Mercado" amount="R$ 720,00" percent={23} />
                  <CategoryBar category="transporte" label="Transporte" amount="R$ 600,00" percent={19} />
                </div>
              </div>
            </Card>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
