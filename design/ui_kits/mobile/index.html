<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Controle Financeiro — App</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg-subtle); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
  .phone {
    width: 390px; height: 820px; max-height: calc(100vh - 40px); background: var(--bg-app);
    border-radius: 44px; border: 11px solid #0b1220; box-shadow: var(--shadow-xl);
    overflow: hidden; position: relative; display: flex; flex-direction: column;
  }
  .statusbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 26px 4px; font-size: 13px; font-weight: 700; color: var(--text-primary); flex-shrink: 0; }
  .app-root { flex: 1; min-height: 0; }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span style="display:flex;gap:6px;align-items:center">5G&nbsp;&nbsp;100%</span></div>
    <div class="app-root" id="root"></div>
  </div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="../icons.js"></script>
  <script src="../dashboard/data.js"></script>
  <script type="text/babel" src="./MobileApp.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<MobileApp />);
  </script>
</body>
</html>
