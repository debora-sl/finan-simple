<!-- @dsCard group="Colors" viewport="700x150" name="Cores semânticas" subtitle="Ações, receitas, despesas e alertas" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { width: 150px; height: 56px; border-radius: var(--radius-md); display: flex; align-items: flex-end; padding: 8px 10px; box-shadow: var(--shadow-xs); }
  .name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .hex { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--action)"></div><div class="name">Ação</div><div class="hex">#2563EB</div></div>
    <div class="sw"><div class="chip" style="background:var(--positive)"></div><div class="name">Receita / positivo</div><div class="hex">#16A34A</div></div>
    <div class="sw"><div class="chip" style="background:var(--negative)"></div><div class="name">Despesa / alerta</div><div class="hex">#DC2626</div></div>
    <div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="name">Vencimento próximo</div><div class="hex">#F59E0B</div></div>
  </div>
</body>
</html>
